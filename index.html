<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<style>
  :root {
    --bg: #ebe9e5;
    --fg: #17171a;
    --muted: #77757a;
    --accent: #ff5a3c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none;
  }

  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2000; pointer-events: none;
    padding: 24px 32px; display: flex; justify-content: space-between; align-items: baseline;
  }
  header h1 { font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  header span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* The shelf: full-bleed so the cards run edge to edge */
  .stage {
    position: absolute; inset: 56px 0 0 0; perspective: 2400px; perspective-origin: 50% 50%;
    overflow: hidden; cursor: grab; touch-action: pan-y;
  }
  .stage.dragging { cursor: grabbing; }

  /* Each cover is a thin 3D slab: front, back, and two edges (thickness --t).
     --eb / --ef are the edge background and text colors, set per site. */
  .world { position: absolute; inset: 0; transform-style: preserve-3d; }
  .cover {
    position: absolute; left: 50%; top: 47%;
    transform-style: preserve-3d; will-change: transform;
  }
  .cover .front, .cover .back, .cover .side { position: absolute; backface-visibility: hidden; }
  .cover .front {
    inset: 0; overflow: hidden; background: var(--eb); border-radius: var(--r);
    transform: translateZ(calc(var(--t) / 2));
  }
  /* Thin black outline around the face so light covers stay visible against the light background */
  .cover .front::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.5px #000; pointer-events: none; z-index: 5; }
  .cover .back { inset: 0; background: var(--eb); border-radius: var(--r); box-shadow: inset 0 0 0 1.5px #000; transform: rotateY(180deg) translateZ(calc(var(--t) / 2)); }
  .cover .side {
    top: var(--r); bottom: var(--r); width: calc(var(--t) + 1px);   /* +1px: overlap the faces so no hairline seam shows */ background: var(--eb); color: var(--ef);
    backface-visibility: visible;
    display: flex; align-items: center; justify-content: center;
  }
  /* Short strips that wrap each rounded corner, so the edge meets the cover all the way round */
  .cover .corner { position: absolute; background: var(--eb); }
  .cover .side.l { left: calc((var(--t) + 1px) / -2); transform: rotateY(-90deg); }
  .cover .side.r { right: calc((var(--t) + 1px) / -2); transform: rotateY(90deg); }
  /* Title on the edge, like a book spine */
  .cover .side span {
    writing-mode: vertical-rl; white-space: nowrap; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; font-size: calc(var(--t) * .58);
  }
  .cover .front .media { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; background: var(--eb); }
  .cover .fallback {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center;
    color: #fff; font-size: 28px; font-weight: 700; letter-spacing: -.02em;
    background: linear-gradient(160deg, #2b2f4a, #6b3f5c);
  }
  /* Darkens cards the further they are from center */
  .cover .shade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

  /* A recreated homepage is laid out 1280px wide (its height follows the card shape) and scaled to fit the card */
  .page { position: absolute; top: 0; left: 0; width: 1280px; height: var(--ph, 1600px); transform-origin: 0 0; transform: scale(var(--s, .4)); pointer-events: none; overflow: hidden; }

  /* ── Recreation: LA Bot Shows ── */
  .lb { background: #101010; font-family: "Arial Narrow", Impact, "Helvetica Neue", Arial, sans-serif; color: #ececec; }
  .lb .nav { position: absolute; inset: 0 0 auto 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 42px 46px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .lb .nav b { font-size: 38px; letter-spacing: .02em; }
  .lb .nav .links { display: flex; align-items: center; gap: 40px; font-size: 26px; color: #fff; }
  .lb .nav .book { padding: 14px 34px; border-radius: 999px; background: #fff; color: #000; font-weight: 700; box-shadow: 0 0 22px rgba(255,255,255,.35); }
  .lb .layout { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 50px; padding: 170px 50px 40px; }
  .lb .figure { position: relative; flex: none; display: flex; align-items: center; justify-content: center; }
  .lb .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .lb .figure img { position: relative; height: 1180px; width: auto; display: block; }
  .lb .text { margin: 0; font-weight: 700; text-transform: uppercase; line-height: .95; font-size: 150px; letter-spacing: .01em; }

  /* ── Recreation: Get To Know Me ── */
  .gk { background: #fff; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; }
  .gk .btn { display: inline-block; padding: 9px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; }
  .gk .blue { background: #0071e3; color: #fff; }
  .gk .hero { text-align: center; padding: 56px 0 64px; color: #fff;
    background: radial-gradient(ellipse 900px 700px at 50% 38%, #b9c7d8 0%, #8fa4bd 22%, #5f7996 46%, #43597a 68%, #33455f 100%); }
  .gk .hero h1 { margin-top: 24px; font-size: 48px; font-weight: 600; letter-spacing: -.025em; line-height: 1; }
  .gk .hero p { margin-top: 12px; font-size: 18px; opacity: .9; }
  .gk .hero .row { margin-top: 24px; display: flex; justify-content: center; gap: 12px; }
  .gk .hero .w { background: #fff; color: #000; }
  .gk .hero .o { border: 1px solid #fff; color: #fff; }
  .gk .intro { display: flex; align-items: center; gap: 40px; padding: 64px; }
  .gk .intro > * { flex: 1; }
  .gk .intro .ph { aspect-ratio: 4/3; border-radius: 16px; background: #d5d5d8; overflow: hidden; }
  .gk .intro .ph img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .gk .intro h2 { font-size: 36px; font-weight: 600; letter-spacing: -.025em; }
  .gk .intro p { margin: 16px 0 24px; font-size: 18px; line-height: 28px; opacity: .8; }
  .gk .grid { display: grid; grid-template-columns: repeat(3, 1fr); }
  .gk .cell { text-align: center; padding: 48px 32px 40px; background: #f5f5f7; }
  .gk .cell.alt { background: #e8f0fb; }
  .gk .cell h3 { font-size: 30px; font-weight: 600; line-height: 36px; }
  .gk .cell p { margin-top: 4px; font-size: 16px; line-height: 24px; opacity: .8; }
  .gk .cell .btns { margin-top: 16px; }
  .gk .cell .grey { background: #d2d2d7; color: #6e6e73; }
  .gk .cell .img { margin: 32px auto 0; max-width: 320px; aspect-ratio: 420/260; border-radius: 8px; overflow: hidden; }
  .gk .cell .img img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .gk .cell .img.fid img { object-fit: cover; transform: translate(15%, -20%) scale(2.15); }
  .gk .cell .img.soon { background: #dde3ea; display: grid; place-items: center; }
  .gk .edu { background: #e8e8ed; text-align: center; padding: 64px 32px; }
  .gk .edu h2 { font-size: 36px; font-weight: 600; letter-spacing: -.025em; }
  .gk .edu p { margin-top: 12px; font-size: 18px; opacity: .8; }
  .gk .edu .btns { margin-top: 20px; }

  /* Floating info bar for the focused site */
  .bar {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 2000;
    display: flex; align-items: center; gap: 18px; padding: 10px 10px 10px 22px; max-width: calc(100vw - 32px);
    background: rgba(255,255,255,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.12);
    transition: opacity .2s;
  }
  .bar.swap { opacity: .3; }
  .bar .meta { min-width: 0; }
  .bar h2 { font-size: 15px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46ch; }
  .bar a {
    flex: none; padding: 10px 18px; border-radius: 999px; background: var(--accent); color: #fff;
    text-decoration: none; font-weight: 600; font-size: 13px;
  }
  .bar a:hover { filter: brightness(1.08); }
  .bar .consult {
    flex: none; padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(0,0,0,.18); background: transparent;
    color: var(--fg); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .bar .consult:hover { background: rgba(0,0,0,.06); }
  /* Phones: size the bar to its contents (left:50% would otherwise squeeze it to half the screen and push the buttons out) */
  @media (max-width: 700px) {
    .bar { width: max-content; gap: 10px; padding: 8px 8px 8px 16px; }
    .bar p { max-width: 24ch; }
  }
</style>

<body>

<header>
  <h1>Selected Work</h1>
  <span id="counter"></span>
</header>

<main class="stage" id="stage" aria-label="Website carousel"></main>

<section class="bar" id="bar" aria-live="polite"></section>

<script src="assets/calendar.js"></script>

<script>
/* ──────────────────────────────────────────────
   EDIT THIS LIST — one entry per card.
   Each card shows ONE kind of cover (first match wins):
     cover : "labot" / "gtkm" — a live recreation of a homepage (see RECREATIONS below)
     video : "assets/clip.mp4" — muted looping video; plays only while the card is near the center
     image : "assets/photo.jpg" — a picture or screenshot
     (none) — the title on a gradient
   For video/image you can also set:
     fit      : "cover" (fill the card, crop the edges; default) or "contain" (show everything, with bars)
     position : where to anchor the crop, as CSS object-position (e.g. "top" for page screenshots)
     poster   : (video only) an image to show until the video loads
   edge / edgeText : the solid color of the card's edge and the title printed on it.
   ────────────────────────────────────────────── */
const SITES = [
  /* Sample cards — delete these and add your own */
  { title: "Atlas Coffee", url: "https://example.com", image: "assets/stock/1.jpg",
    edge: "#b49a6d", edgeText: "#111111", tags: "E-commerce", description: "Sample project — replace with your own." },
  { title: "Northwind Studio", url: "https://example.com", image: "assets/stock/2.jpg",
    edge: "#b3afc2", edgeText: "#111111", tags: "Agency", description: "Sample project — replace with your own." },
  { title: "Pine & Co.", url: "https://example.com", image: "assets/stock/3.jpg",
    edge: "#5d5063", edgeText: "#f5f5f5", tags: "Branding", description: "Sample project — replace with your own." },
  { title: "Harbor Fitness", url: "https://example.com", image: "assets/stock/4.jpg",
    edge: "#d0cbba", edgeText: "#111111", tags: "Web app", description: "Sample project — replace with your own." },
  { title: "Lumen Labs", url: "https://example.com", image: "assets/stock/5.jpg",
    edge: "#48474a", edgeText: "#f5f5f5", tags: "Landing page", description: "Sample project — replace with your own." },
  { title: "Get To Know Me", url: "https://luis-ramirez-orozco.github.io/GetToKnowMe/", cover: "gtkm",
    edge: "#f5f5f7", edgeText: "#1d1d1f", tags: "Personal site", description: "Engineering portfolio and projects." },
  { title: "LA Bot Shows",   url: "https://labotshows.com", cover: "labot",
    edge: "#101010", edgeText: "#ececec", tags: "Business site", description: "Robot performances for events." },
  { title: "OC Bot Shows", url: "https://luis-ramirez-orozco.github.io/ocbotshows/", image: "shots/ocbotshows.jpg", fit: "cover", position: "top",
    edge: "#ebe9e5", edgeText: "#17171a", tags: "Business site", description: "LED robot shows for Orange County events." },
  { title: "Photobooth", url: "https://luis-ramirez-orozco.github.io/photobooth/", image: "shots/photobooth.jpg", fit: "cover", position: "top",
    edge: "#241a2a", edgeText: "#f1ecff", tags: "Business site", description: "Photo booth rentals for events across LA." },
  { title: "Field Notes", url: "https://example.com", image: "assets/stock/6.jpg",
    edge: "#8d8c89", edgeText: "#f5f5f5", tags: "Blog", description: "Sample project — replace with your own." },
  { title: "Orbit Music", url: "https://example.com", image: "assets/stock/7.jpg",
    edge: "#7291bc", edgeText: "#111111", tags: "Music", description: "Sample project — replace with your own." },
];

/* Tunables */
/* Card size. Everything else (spacing, thickness, corner radius) scales with the card width. */
const ASPECT = 0.8;        // card shape, width / height: 0.8 = 4:5 portrait, 1 = square, 9/16 = phone video, 16/9 = landscape video
const CARD_HEIGHT = 0.78;  // card height as a fraction of the carousel area's height (bigger = larger cards)
const CARD_MAX_WIDTH = 0.78; // card width is also capped at this fraction of the window width
const PITCH = 0.17;        // distance between neighbouring cards, fraction of card width
const ANGLE_NEAR = 90;     // cards at the center are edge-on...
const ANGLE_FAR = 48;      // ...and ease toward this many degrees from edge-on out at the sides
const CENTER_GAP = 0.14;   // clear space at the center of the row, fraction of card width
const OPEN_MS = 1000;       // time to open or close a card
const OPEN_LIFT = 200;     // how far an opened card comes forward, in px
const OPEN_GAP = 0.62;     // how far neighbours slide aside when a card is opened, fraction of card width
const RADIUS = 0.024;       // corner rounding, fraction of card width
const CORNER_STEPS = 5;    // segments used to wrap each rounded corner
const THICKNESS = 0.035;    // card thickness, fraction of card width
const EASE = 0.0085;       // per millisecond; frame-rate independent
const DESIGN_W = 1280;     // recreations are laid out 1280px wide (height = 1280 / ASPECT) and scaled down
const VIDEO_RANGE = 2.5;   // videos play while the card is within this many cards of the center

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ──────────────────────────────────────────────
   RECREATIONS — small live copies of each homepage.
   Each returns { html, init(root) } where init may return { tick(t, light) }.
   `light` is the pointer position in design coordinates (1280 wide), or null.
   ────────────────────────────────────────────── */
const RECREATIONS = {
  gtkm: () => ({
    html: `
      <div class="page gk">
        <section class="hero">
          <h1>Luis Ramirez Orozco</h1>
          <p>Mechanical Engineer · Los Angeles, CA · EIT #184349</p>
          <div class="row"><span class="btn w">Get in touch</span><span class="btn o">See projects</span></div>
        </section>
        <section class="intro">
          <div class="ph"><img src="assets/cnc.jpg" alt=""></div>
          <div><h2>Hi, I'm Luis.</h2>
            <p>A short introduction goes here — a bit about your background, what drives your engineering work, and what you want visitors to know before they dive into your projects.</p>
            <span class="btn blue">See more</span></div>
        </section>
        <div class="grid">
          <div class="cell"><h3>Pool Table</h3><p>Pool table design made from aluminum and maple.</p>
            <div class="btns"><span class="btn blue">View project</span></div>
            <div class="img"><img src="assets/pool.png" alt=""></div></div>
          <div class="cell alt"><h3>Fidget Clicker</h3><p>A fidget toy, design journey.</p>
            <div class="btns"><span class="btn blue">View project</span></div>
            <div class="img fid"><img src="assets/fidget.png" alt=""></div></div>
          <div class="cell"><h3>Coming Soon</h3><p>A new project is in the works — stay tuned.</p>
            <div class="btns"><span class="btn grey">View project</span></div>
            <div class="img soon"><svg width="64" height="64" viewBox="0 0 24 24" fill="#1d1d1f" fill-opacity=".4"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div></div>
        </div>
        <section class="edu"><h2>Education.</h2>
          <p>B.S. Mechanical Engineering — California State University, Los Angeles, 2024</p>
          <div class="btns"><span class="btn blue">FE Examination</span></div></section>
      </div>`
  }),

  /* The robot and heading are hidden in the dark except where a spotlight hits them.
     The spotlight follows the pointer (or wanders on its own), and the robot also
     flashes on a strobe cycle — same logic as the real site. */
  labot: () => {
    const FALLOFF = [1, 0.84375, 0.5, 0.15625, 0];
    const RADIUS = 400;
    const CYCLE = 2.6;
    const STOPS = [[0,.03],[.04,.95],[.08,.05],[.12,.75],[.16,.03],[.55,.05],[.70,.95],[.75,.05],[1,.03]];
    const strobe = t => {
      const ph = (t % CYCLE) / CYCLE;
      for (let i = 0; i < STOPS.length - 1; i++) {
        const a = STOPS[i], b = STOPS[i + 1];
        if (ph >= a[0] && ph <= b[0]) return a[1] + (b[1] - a[1]) * (ph - a[0]) / (b[0] - a[0]);
      }
      return .03;
    };
    const mask = (x, y, ghost) =>
      `radial-gradient(circle ${RADIUS}px at ${x.toFixed(0)}px ${y.toFixed(0)}px, ` +
      FALLOFF.map((f, i) => `rgba(0,0,0,${(ghost + (1 - ghost) * f).toFixed(3)}) ${i * 25}%`).join(',') + ')';
    return {
      html: `
        <div class="page lb">
          <div class="nav"><b>LA Bot Shows</b><div class="links"><span>Gallery</span><span>About Us</span><span class="book">Book Now</span></div></div>
          <div class="layout">
            <div class="flash"></div>
          <div class="figure"><img src="assets/robot-cutout.png" alt=""></div>
            <p class="text">Book Your<br>Event Today</p>
          </div>
        </div>`,
      init(root) {
        const flash = root.querySelector('.flash'), robot = root.querySelector('.figure img'), text = root.querySelector('.text');
        const off = el => { let x = 0, y = 0; for (; el && el !== root; el = el.offsetParent) { x += el.offsetLeft; y += el.offsetTop; } return [x, y]; };
        let cx = DESIGN_W / 2, cy = 700;
        const apply = (el, m) => { el.style.webkitMaskImage = el.style.maskImage = m; };
        return {
          tick(t, light) {
            // Light eases toward the pointer, or drifts on its own when the pointer is elsewhere
            const tx = light ? light.x : (0.5 + 0.31 * Math.sin(t * .37)) * DESIGN_W;
            const ty = light ? light.y : (0.5 - 0.25 * Math.sin(t * .53 + 1.3)) * (DESIGN_W / ASPECT);
            cx += (tx - cx) * .18; cy += (ty - cy) * .18;
            const s = reduced ? .45 : strobe(t);
            const [rx, ry] = off(robot), [px, py] = off(text);
            apply(text, mask(cx - px, cy - py, .03));
            apply(robot, mask(cx - rx, cy - ry, s));
            flash.style.opacity = (s * 0.1).toFixed(3);   // the strobe washes the whole stage, not a bubble around the robot
          }
        };
      }
    };
  },
};

const stage = document.getElementById('stage');
const bar = document.getElementById('bar');
const counter = document.getElementById('counter');
const last = SITES.length - 1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const START = SITES.findIndex(s => s.cover === 'gtkm') + 0.5;   // between Get To Know Me and LA Bot Shows
let target = START, pos = START, index = -1, W = 0, H = 0, raf = 0, lastT = 0;
let wantOpen = -1, openIdx = -1, open = 0, openT = 0, visible = 9;   // opened card index, how far it has swung open (0-1), cards drawn per side
let moved = false;

const world = document.createElement('div'); world.className = 'world'; stage.appendChild(world);

/* Build covers */
const covers = SITES.map((s, i) => {
  const el = document.createElement('div');
  el.className = 'cover';
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', s.title);
  el.style.display = 'none';
  el.style.setProperty('--eb', s.edge || '#222');
  el.style.setProperty('--ef', s.edgeText || '#fff');

  const front = document.createElement('div'); front.className = 'front';
  if (s.cover && RECREATIONS[s.cover]) {
    const rec = RECREATIONS[s.cover]();
    front.innerHTML = rec.html;
    if (rec.init) el._live = rec.init(front.firstElementChild);
  } else if (s.video) {
    const v = document.createElement('video');
    v.className = 'media'; v.src = s.video; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata';
    if (s.poster) v.poster = s.poster;
    v.style.objectFit = s.fit || 'cover'; v.style.objectPosition = s.position || 'center';
    front.appendChild(v);
    el._video = v;
  } else if (s.image) {
    const img = new Image(); img.className = 'media'; img.src = s.image; img.alt = ''; img.draggable = false; img.decode().catch(() => {});   // pre-decode so covers never pop in blank while scrolling
    img.style.objectFit = s.fit || 'cover'; img.style.objectPosition = s.position || 'center';
    front.appendChild(img);
  } else {
    const fb = document.createElement('div'); fb.className = 'fallback'; fb.textContent = s.title;
    front.appendChild(fb);
  }
  const shade = document.createElement('div'); shade.className = 'shade';
  front.appendChild(shade);

  const back = document.createElement('div'); back.className = 'back';
  const side = cls => { const d = document.createElement('div'); d.className = 'side ' + cls; d.appendChild(document.createElement('span')).textContent = s.title; return d; };
  el._corners = [];
  for (let k = 0; k < 4 * CORNER_STEPS; k++) { const c = document.createElement('div'); c.className = 'corner'; el._corners.push(c); }
  el.append(front, back, side('l'), side('r'), ...el._corners);
  el._front = front; el._shade = shade;

  world.appendChild(el);
  return el;
});

/* Phones only: cards sit smaller on the shelf and grow to fill most of the screen when tapped open.
   openS is the extra scale an opened card gets (1 on desktop, so desktop is unchanged). */
const MOBILE_MAX = 700, M_CARD_HEIGHT = 0.5, M_CARD_MAX_WIDTH = 0.5, M_OPEN_WIDTH = 0.9, M_OPEN_HEIGHT = 0.88;
let openS = 1;

function measure() {
  const mobile = innerWidth <= MOBILE_MAX;
  const h = stage.clientHeight * (mobile ? M_CARD_HEIGHT : CARD_HEIGHT);
  W = Math.min(h * ASPECT, stage.clientWidth * (mobile ? M_CARD_MAX_WIDTH : CARD_MAX_WIDTH));
  H = W / ASPECT;
  covers.forEach(el => {
    el.style.width = W + 'px'; el.style.height = H + 'px';
    el.style.marginLeft = -W / 2 + 'px'; el.style.marginTop = -H / 2 + 'px';
    el.style.setProperty('--t', W * THICKNESS + 'px');
    el.style.setProperty('--r', W * RADIUS + 'px');
    el.style.setProperty('--s', W / DESIGN_W);
    el.style.setProperty('--ph', DESIGN_W / ASPECT + 'px');

    // Lay out the corner-wrapping segments along each quarter circle
    const r = W * RADIUS, t = W * THICKNESS;
    [[r, r, 180], [W - r, r, 270], [W - r, H - r, 0], [r, H - r, 90]].forEach(([cx, cy, a0], c) => {
      for (let k = 0; k < CORNER_STEPS; k++) {
        const a = (a0 + 90 * k / CORNER_STEPS) * Math.PI / 180, b = (a0 + 90 * (k + 1) / CORNER_STEPS) * Math.PI / 180;
        // Vertices sit slightly outside the arc so each flat segment just touches it (instead of cutting inside it)
        const ro = r / Math.cos(Math.PI / (4 * CORNER_STEPS));
        const ax = cx + ro * Math.cos(a), ay = cy + ro * Math.sin(a), bx = cx + ro * Math.cos(b), by = cy + ro * Math.sin(b);
        const L = Math.hypot(bx - ax, by - ay) + 1, mx = (ax + bx) / 2, my = (ay + by) / 2;
        const seg = el._corners[c * CORNER_STEPS + k].style;
        seg.width = L + 'px'; seg.height = t + 1 + 'px'; seg.left = mx - L / 2 + 'px'; seg.top = my - (t + 1) / 2 + 'px';
        seg.transform = `rotateZ(${Math.atan2(by - ay, bx - ax)}rad) rotateX(90deg)`;
      }
    });
  });
  const persp = 2400 / (2400 - OPEN_LIFT);   // the lift toward the viewer already magnifies a little
  openS = mobile ? Math.max(1, Math.min(stage.clientWidth * M_OPEN_WIDTH / W, stage.clientHeight * M_OPEN_HEIGHT / H) / persp) : 1;
  visible = Math.min(24, Math.ceil(stage.clientWidth / 2 / (W * PITCH)) + 2);
}

/* Cards sit in one tight row. Every card is turned nearly edge-on, a little less the farther
   it is from center, so the row reads as a fan of spines. A card passes through the center
   edge-on (thin), never swinging flat, so there is no big rotation as it goes by.
   An opened card is the one exception: it hinges up to face you while its neighbours slide aside. */
const ease = x => x * x * x * (x * (x * 6 - 15) + 10);   // smootherstep: gentle start and finish
const angleAt = ad => ANGLE_NEAR - (ANGLE_NEAR - ANGLE_FAR) * (1 - Math.exp(-0.55 * ad));

/* Opening is staged, like pulling a book off a shelf, and closing simply plays it backwards:
   the card slides forward out of the row, its neighbours part to make room, and only then
   does it turn to face you. So it never grows into its neighbours or appears from behind them. */
const stageOf = (t, from, to) => ease(clamp((t - from) / (to - from), 0, 1));

function layout(p) {
  const lift = stageOf(openT, 0, 0.45), spread = stageOf(openT, 0.1, 0.65), turn = stageOf(openT, 0.3, 1);
  covers.forEach((el, i) => {
    const d = i - p, ad = Math.abs(d);
    if (ad > visible) { if (el.style.display !== 'none') el.style.display = 'none'; return; }
    if (el.style.display === 'none') el.style.display = '';

    const isOpen = i === openIdx && openT > 0.001;
    const near = Math.min(ad, 1), gap = near * near * (3 - 2 * near);   // smoothstep: the gap opens as a card nears center
    let x = d * W * PITCH + Math.sign(d) * gap * W * CENTER_GAP;
    let rot = (d < 0 ? 1 : -1) * angleAt(ad);        // left cards lean one way, right cards the other
    let z = 0;
    if (isOpen) {
      // Blend the lean direction smoothly through center so scrolling either way is continuous
      // Lean direction: a hard left/right choice while still edge-on (so it stays edge-on at the center),
      // blending to a smooth one as it opens so scrolling either way stays continuous
      const lean = -(turn * clamp(d / (0.0001 + turn * 0.6), -1, 1) + (1 - turn) * (d < 0 ? -1 : 1));
      rot = lean * angleAt(ad) * (1 - turn); z = lift * OPEN_LIFT;
    }
    else if (openT > 0.001 && openIdx >= 0) x += Math.sign(i - openIdx) * spread * W * OPEN_GAP * openS;

    const sc = isOpen ? 1 + (openS - 1) * turn : 1;
    el.style.transform = `translate3d(${x}px,0,${z}px) rotateY(${rot}deg)` + (sc !== 1 ? ` scale(${sc})` : '');
    el._shade.style.opacity = isOpen ? 0 : Math.min(ad, 5) * 0.05;

    // Videos only play while near the center (saves CPU/battery and keeps scrolling smooth)
    if (el._video) {
      const want = ad < VIDEO_RANGE;
      if (want !== !!el._playing) {
        el._playing = want;
        if (want) { el._video.preload = 'auto'; el._video.play().catch(() => {}); } else el._video.pause();
      }
    }
  });
}

function setBar(i) {
  const s = SITES[i];
  bar.classList.add('swap');
  clearTimeout(setBar.t);
  setBar.t = setTimeout(() => {
    bar.textContent = '';
    const meta = document.createElement('div'); meta.className = 'meta';
    const h = document.createElement('h2'); h.textContent = s.title;
    const p = document.createElement('p'); p.textContent = [s.tags, s.description].filter(Boolean).join(' — ');
    meta.append(h, p);
    const a = document.createElement('a'); a.textContent = 'Visit site ↗'; a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    const c = document.createElement('button'); c.type = 'button'; c.className = 'consult'; c.textContent = 'Book a Consult';
    c.addEventListener('click', () => window.openConsultCalendar && window.openConsultCalendar());
    bar.append(meta, c, a);
    bar.classList.remove('swap');
  }, 120);
  counter.textContent = `${String(i + 1).padStart(2, '0')} / ${String(SITES.length).padStart(2, '0')}`;
}

/* Movement loop: eases `pos` toward `target`, only runs while moving */
function frame(now) {
  raf = 0;
  const dt = Math.min(now - (lastT || now - 16), 48);
  lastT = now;
  pos += (target - pos) * (1 - Math.exp(-EASE * dt * 2.4));
  if (Math.abs(target - pos) < 0.0008) pos = target;
  // A card only swings open once it has arrived at the center
  // The card being opened only changes once the previous one has fully closed, so closing always animates
  if (openIdx !== wantOpen && openT === 0) openIdx = wantOpen;
  const openGoal = openIdx === wantOpen && wantOpen >= 0 && Math.abs(pos - wantOpen) < 0.12 ? 1 : 0;
  openT = clamp(openT + (openGoal ? dt : -dt) / OPEN_MS, 0, 1);
  open = ease(openT);
  layout(pos);
  const i = clamp(Math.round(pos), 0, last);
  if (i !== index) { index = i; setBar(i); }
  if (pos !== target || openT !== openGoal || openIdx !== wantOpen) raf = requestAnimationFrame(frame); else lastT = 0;
}
function kick() { if (!raf) raf = requestAnimationFrame(frame); }
function setTarget(v) { target = clamp(v, 0, last); kick(); }
function close() { if (wantOpen >= 0) { wantOpen = -1; kick(); } }

/* Animation loop for the recreated homepages: only covers near the center are updated.
   The pointer drives the focused card's spotlight. */
let pointer = null;   // {x, y} in design coordinates of the focused card, or null
function updatePointer(e) {
  const f = covers[index] && covers[index]._front;
  if (!f) return;
  const r = f.getBoundingClientRect();
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  pointer = inside ? { x: (e.clientX - r.left) / r.width * DESIGN_W, y: (e.clientY - r.top) / r.height * DESIGN_W / ASPECT } : null;
}
stage.addEventListener('pointermove', updatePointer);
stage.addEventListener('pointerleave', () => pointer = null);

function liveLoop(now) {
  const t = now / 1000;
  covers.forEach((el, i) => {
    if (el._live && Math.abs(pos - i) < 5) el._live.tick(t, i === openIdx && open > .5 ? pointer : null);
  });
  requestAnimationFrame(liveLoop);
}

/* Wheel / trackpad: free, continuous scrolling (no snapping) */
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  // A card was just picked: ignore the rest of that scroll gesture (trackpad momentum can trail on
  // for over a second and would otherwise close the card or pull the carousel off it).
  const now = performance.now(), gap = now - lastWheel;
  lastWheel = now;
  if (gap > 150) wheelLocked = false;                     // a pause means the old gesture is over
  if (wheelLocked || now - lastActivate < 300 || Math.abs(delta) < 2) return;
  close();
  setTarget(target + delta * 0.006);
}, { passive: false });

addEventListener('keydown', e => {
  if (document.body.classList.contains('modal-open')) return;   // the booking calendar is open
  const k = e.key;
  if (k !== 'Enter' && k !== ' ') close();
  if (k === 'ArrowRight' || k === 'ArrowDown') setTarget(Math.round(target) + 1);
  else if (k === 'ArrowLeft' || k === 'ArrowUp') setTarget(Math.round(target) - 1);
  else if (k === 'Home') setTarget(0);
  else if (k === 'End') setTarget(last);
  else if (k === 'Escape') close();
  else if (k === 'Enter' || k === ' ') {
    e.preventDefault();
    if (wantOpen === index && open > .9) window.open(SITES[index].url, '_blank', 'noopener');
    else { wantOpen = index; kick(); }
  }
});

/* Selecting a card. Handled on pointer-up using the card that was pressed: cards keep moving
   under the cursor, so a normal click event can land on a different element and be dropped. */
function activate(i) {
  lastActivate = performance.now();
  wheelLocked = true;
  if (wantOpen === i && open > .9) window.open(SITES[i].url, '_blank', 'noopener');
  else { wantOpen = i; setTarget(i); }
}
let lastActivate = 0, downIdx = -1, lastWheel = 0, wheelLocked = false;

/* Drag / swipe */
let dragging = false, startX = 0, startT = 0, lastX = 0, vel = 0;
stage.addEventListener('pointerdown', e => {
  const c = e.target.closest && e.target.closest('.cover');
  downIdx = c ? covers.indexOf(c) : -1;
  dragging = true; moved = false; startX = lastX = e.clientX; startT = target; vel = 0;
  stage.classList.add('dragging');
});
addEventListener('pointermove', e => {
  if (!dragging) return;
  if (Math.abs(e.clientX - startX) > 8) moved = true;
  if (!moved) return;
  close();
  vel = e.clientX - lastX; lastX = e.clientX;
  target = clamp(startT - (e.clientX - startX) / (W * PITCH), 0, last);
  pos = target;                      // track the pointer 1:1 while dragging
  kick();
});
addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false; stage.classList.remove('dragging');
  if (moved) setTarget(target - clamp(vel, -60, 60) / (W * PITCH) * 7);   // let a flick glide
  else if (downIdx >= 0) activate(downIdx);
  setTimeout(() => moved = false, 0);
});

addEventListener('resize', () => { measure(); layout(pos); });
measure(); kick(); requestAnimationFrame(liveLoop);
</script>
</body>
</html>
